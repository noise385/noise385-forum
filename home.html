<style>

    position:fixed; right:18px; top:50%; transform:translateY(-50%);

  }
  .n385-social a{
    width:52px; height:52px; border-radius:50%;
    display:grid; place-items:center; color:#fff; text-decoration:none;

  }

  .n385-social .n385-fb{ background:#1877F2; }
  .n385-social a::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    box-shadow:0 0 0 0 rgba(0,232,255,.5);
    animation:n385socialpulse 2.4s ease-out 3;
  }
  @keyframes n385socialpulse{
    0%{ box-shadow:0 0 0 0 rgba(0,232,255,.5); }
    70%{ box-shadow:0 0 0 14px rgba(0,232,255,0); }
    100%{ box-shadow:0 0 0 0 rgba(0,232,255,0); }
  }
  @media(max-width:700px){
    .n385-social{ right:12px; top:auto; bottom:20px; transform:none; }

  @media(prefers-reduced-motion:reduce){ .n385-social a::after{ animation:none; } }
